<!-- templates/create_assignment.html -->
{% extends "base.html" %}
{% block title %}Create Assignment{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Create Assignment</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="title" class="form-label">Assignment Title</label>
                        <input type="text" class="form-control" id="title" name="title" required>
                    </div>
                    <div class="mb-3">
                        <label for="description" class="form-label">Description</label>
                        <textarea class="form-control" id="description" name="description" rows="5" required></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="due_date" class="form-label">Due Date (Optional)</label>
                        <input type="datetime-local" class="form-control" id="due_date" name="due_date">
                    </div>
                    <div class="mb-3">
                        <label for="max_points" class="form-label">Maximum Points</label>
                        <input type="number" class="form-control" id="max_points" name="max_points" value="100">
                    </div>
                    <button type="submit" class="btn btn-primary">Create Assignment</button>
                    <a href="{{ url_for('view_course', course_id=course_id) }}" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
