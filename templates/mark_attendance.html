<!-- templates/mark_attendance.html -->
{% extends "base.html" %}
{% block title %}Mark Attendance{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Mark Attendance - {{ course.title }}</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="date" class="form-label">Date</label>
                        <input type="date" class="form-control" id="date" name="date" required value="{{ now.date() if now else '' }}">
                    </div>
                    <table class="table">
                        <thead>
                            <tr><th>Student Name</th><th>Status</th></tr>
                        </thead>
                        <tbody>
                            {% for student in students %}
                            <tr>
                                <td>{{ student.name }}</td>
                                <td>
                                    <select name="attendance_{{ student.id }}" class="form-select">
                                        <option value="present">Present</option>
                                        <option value="absent">Absent</option>
                                    </select>
                                </td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                    <button type="submit" class="btn btn-primary">Save Attendance</button>
                    <a href="{{ url_for('view_course', course_id=course.id) }}" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
